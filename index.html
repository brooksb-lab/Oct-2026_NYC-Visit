<!doctype html><html><head><title>NYC October ’26</title><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap">
<style>
/* Look: MTA signage. One grotesk (Helvetica, Inter where Helvetica is missing), black sign bands with the white stripe,
   round bullets in official line colors. Text is always black or white; color lives in the bullets.
   Layout: one phone-width column. Each day is a strip map: times left, a rail of stops, details right. */
:root{
  --bg:#ffffff; --surface:#ffffff; --ink:#000000; --muted:#595959; --faint:#767676; --line:#d6d6d6; --rail:#a7a9ac;
  --fun:#0039a6; --meal:#ff6319; --between:#808183; --on-solid:#ffffff; --ring:transparent;
  --sign:#000000; --sign-ink:#ffffff; --sign-muted:#d0d0d0; --flag:#fccc0a; --focus:#0039a6;
  --water:#bfdcee; --land:#f4f1e4; --park:#cfe3b4; --shore:#a9c3d4;
  --font:"Helvetica Neue","Inter",Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121212; --surface:#121212; --ink:#ffffff; --muted:#b3b3b3; --faint:#858585; --line:#343434; --rail:#6d6e71;
    --ring:rgba(255,255,255,.75); --focus:#ffffff;
    --water:#10222f; --land:#262626; --park:#1f3323; --shore:#3d4a54;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121212; --surface:#121212; --ink:#ffffff; --muted:#b3b3b3; --faint:#858585; --line:#343434; --rail:#6d6e71;
  --ring:rgba(255,255,255,.75); --focus:#ffffff;
  --water:#10222f; --land:#262626; --park:#1f3323; --shore:#3d4a54;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.4;-webkit-font-smoothing:antialiased}
.wrap{max-width:640px;margin:0 auto;padding-inline:18px;padding-block:22px 48px;display:flex;flex-direction:column;gap:34px}
a{color:var(--ink);text-decoration-thickness:1px;text-underline-offset:3px}
a:focus-visible,button:focus-visible{outline:3px solid var(--focus);outline-offset:2px}

/* The title block sticks while the weather slides up under it. It lives in .lead with the weather, so when the
   weather ends the block is carried off screen just as the Next up bar arrives and takes the top. */
.lead{display:flex;flex-direction:column;gap:20px}
.top{display:flex;flex-direction:column;gap:6px;border-top:5px solid var(--ink);padding-top:16px;padding-bottom:14px;
  position:sticky;top:env(safe-area-inset-top,0px);z-index:4;background:var(--bg)}
.eyebrow{font-weight:500;font-size:15px;color:var(--muted)}
h1{font-weight:700;font-size:34px;line-height:1.05;letter-spacing:-.025em;margin:0;text-wrap:balance}
.stamp{color:var(--faint);font-size:14px;margin:0}
.key{display:flex;flex-wrap:wrap;gap:6px 18px;margin:8px 0 0;padding:0;list-style:none;font-size:15px;font-weight:500}
.key li{display:flex;align-items:center;gap:8px}

.dot{flex:none;width:16px;height:16px;border-radius:50%;background:var(--bg);border:4px solid var(--between)}
.dot.fun{background:var(--fun);border-color:var(--fun);box-shadow:0 0 0 1.5px var(--ring)}
.dot.meal{border-color:var(--meal)}
.dot.between{width:10px;height:10px;border-width:3px}

.wx{position:relative;border-radius:14px;overflow:hidden;background:#05070f;color:#fff;border:1px solid #1c2233}
.wx svg.sky{position:absolute;inset:0;width:100%;height:100%}
.wx .now{position:relative;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding:92px 18px 16px}
.wx .loc{font-size:13px;font-weight:500;letter-spacing:.2em;color:#8f9bb8;margin:0 0 4px}
.wx .big{font-size:60px;line-height:1;font-weight:300;letter-spacing:-.03em;margin:0}
.wx .side{text-align:right}
.wx .skyt{font-size:19px;color:#b4bdd6;margin:0}
.wx .sub{font-size:13px;color:#7f8aa6;margin:3px 0 0}
.wx .row{position:relative;display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid #1c2233;background:rgba(5,7,15,.55)}
.wx .row a{display:flex;flex-direction:column;align-items:center;gap:5px;padding:12px 4px 13px;color:#fff;text-decoration:none;border-left:1px solid #1c2233}
.wx .row a:first-child{border-left:0}
.wx .row a.on{background:rgba(255,255,255,.08)}
.wx .wd{font-size:15px;color:#8f9bb8}
.wx .on .wd{color:#fff;font-weight:700}
.wx .hi{font-size:21px;font-weight:500;font-variant-numeric:tabular-nums}
.wx .pp{display:flex;align-items:center;gap:4px;height:18px;font-size:13px;color:#8f9bb8}
.wx .pp svg{width:16px;height:16px}
nav.jump{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--sign);margin-inline:-18px;padding-inline:14px}
nav.jump ul{display:flex;justify-content:space-between;gap:4px;margin:0;padding:0;list-style:none}
nav.jump a{display:block;white-space:nowrap;text-align:center;padding:9px 4px 8px;font-weight:700;font-size:13px;line-height:18px;letter-spacing:0;color:var(--sign-ink);text-decoration:none}

section{scroll-margin-top:calc(var(--navh,35px) + 10px);display:flex;flex-direction:column;gap:16px}
.dayhead{display:flex;align-items:center;gap:12px;margin-inline:-18px;padding:17px 18px 12px;color:var(--sign-ink);
  background:linear-gradient(var(--sign) 0 5px,var(--sign-ink) 5px 7px,var(--sign) 7px)}
.bullet{flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:23px;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.dayhead h2,.plain h2{font-weight:700;font-size:25px;line-height:1.1;letter-spacing:-.02em;margin:0}
.daymeta{color:var(--sign-muted);font-size:15px;margin:3px 0 0}
.tag{font-weight:700;font-size:13px;letter-spacing:0;color:#000;background:var(--flag);padding:2px 7px;border-radius:3px;margin-left:8px;vertical-align:3px}

ol.stops{list-style:none;margin:0;padding:0}
ol.stops li{display:grid;grid-template-columns:4.5em 22px minmax(0,1fr);column-gap:10px;position:relative;padding-bottom:16px}
ol.stops li::before{content:"";position:absolute;left:calc(4.5em + 10px + 9.5px);top:6px;bottom:-6px;width:3px;background:var(--rail)}
ol.stops li:last-child::before{display:none}
.tap{cursor:pointer;-webkit-tap-highlight-color:transparent}
.time{font-weight:700;font-size:16px;letter-spacing:-.01em;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap;padding-top:2px}
.time small{font-size:12px;font-weight:500;color:var(--muted);margin-left:2px}
.rail{display:flex;justify-content:center;padding-top:5px;position:relative;z-index:1}
li.between .rail{padding-top:8px}
.what{min-width:0}
.what .t{font-weight:700;font-size:18px;line-height:1.25;letter-spacing:-.01em;margin:0;overflow-wrap:anywhere}
li.between .t{font-weight:400;font-size:16px;letter-spacing:0;color:var(--muted)}
li.between .time{font-weight:500;color:var(--muted);font-size:15px}
.where,.note{margin:2px 0 0;font-size:15px;color:var(--muted);overflow-wrap:anywhere}
details.go{margin:0}
details.go summary{list-style:none;display:flex;align-items:flex-start;gap:6px;padding:6px 0 5px;cursor:pointer;color:var(--muted);font-size:15px;overflow-wrap:anywhere;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
details.go summary::-webkit-details-marker{display:none}
details.go summary svg{flex:none;width:15px;height:15px;margin-top:3px;fill:var(--ink)}
details.go[open] summary{color:var(--ink)}
details.go summary:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.links{display:flex;flex-wrap:wrap;gap:0 18px;margin:0 0 2px;padding-left:21px;font-size:15px}
.links a{padding:6px 0 8px;font-weight:700}
.links .dl{padding:6px 0 8px;color:var(--muted);margin-right:-6px}

.plain{border-top:4px solid var(--ink);padding-top:14px}
.plain p{margin:0;color:var(--muted);font-size:16px;max-width:60ch}
.sorter{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--navh,35px));z-index:4;background:var(--bg);margin-inline:-18px;padding:6px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.sorter .lab{font-size:13px;font-weight:700;margin-right:2px;white-space:nowrap}
.sorter button{flex:1;font-family:var(--font);font-weight:700;font-size:13px;line-height:18px;padding:3px 4px;border-radius:999px;border:1.5px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer}
.sorter button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
#eats{display:flex;flex-direction:column;gap:22px}
.group{scroll-margin-top:calc(var(--navh,35px) + 50px)}
.ghead{display:flex;align-items:center;gap:10px;background:var(--sign);color:var(--sign-ink);padding:10px 12px;border-radius:3px}
.ghead .gb{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:15px;letter-spacing:-.04em}
.ghead h3{font-weight:700;font-size:19px;line-height:1.15;letter-spacing:-.015em;margin:0}
.ghead .gm{font-size:14px;color:var(--sign-muted);margin:2px 0 0}
ul.eats{list-style:none;margin:0;padding:0 0 0 8px}
ul.eats li{border-bottom:1px solid var(--line)}
ul.eats li.none{padding:12px 0;color:var(--muted);font-size:15px}
ul.eats li.moreopt{border-bottom:0;padding:4px 0 0 22px}
ul.eats li.moreopt a{display:inline-block;padding:9px 0;font-size:15px;font-weight:700}
button.eat{display:grid;grid-template-columns:12px minmax(0,1fr) 20px;column-gap:10px;align-items:start;width:100%;text-align:left;font:inherit;color:inherit;background:none;border:0;padding:11px 0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button.eat .dot{width:12px;height:12px;border-width:3px;margin-top:6px}
button.eat .n{display:block;font-weight:700;font-size:17px;letter-spacing:-.01em}
button.eat .k{display:block;color:var(--muted);font-size:15px}
button.eat .pm{font-size:21px;line-height:24px;font-weight:400;color:var(--muted);text-align:center}
ul.eats .more{padding:0 0 12px 22px}
ul.eats .more img{display:block;width:100%;aspect-ratio:3/2;object-fit:cover;border-radius:4px;margin:2px 0 10px;background:var(--line)}
ul.eats .more p{margin:0;font-size:16px;line-height:1.45;color:var(--ink);max-width:60ch}
ul.eats .more .links{padding-left:0;margin:6px 0 0}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{font-family:var(--font);font-weight:700;font-size:15px;padding:8px 13px;border-radius:999px;border:2px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.mapbox{border:1px solid var(--line);border-radius:4px;overflow:hidden;background:var(--water)}
.mapbox svg{display:block;width:100%;height:auto}
.mapbox svg + .cap{border-top:1px solid var(--line)}
.cap{margin:0;padding:8px 12px;background:var(--sign);color:var(--sign-ink);font-weight:700;font-size:15px}
.geo{font-family:var(--font);font-weight:700;letter-spacing:.08em;fill:var(--muted)}
.pinlab{font-family:var(--font);font-weight:700;fill:var(--ink);stroke:var(--land);stroke-linejoin:round;paint-order:stroke}
.pinnum{font-family:var(--font);font-weight:700;fill:var(--on-solid)}
ol.legend{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
ol.legend li{display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.num{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:15px;color:var(--on-solid);background:var(--between)}
.num.fun{background:var(--fun);box-shadow:0 0 0 1.5px var(--ring)} .num.meal{background:var(--meal)}
ol.legend .n{font-weight:700;font-size:17px;letter-spacing:-.01em;margin:0}
ol.legend .w{color:var(--muted);font-size:15px;margin:1px 0 0}
footer{color:var(--muted);font-size:15px;border-top:1px solid var(--line);padding-top:14px}

/* ---------- live and interactive layer ---------- */
.livebox{display:flex;flex-direction:column;gap:12px}
.stamp button{font:inherit;color:inherit;background:none;border:0;padding:0;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px;cursor:pointer}

/* service change banner */
.svc{background:var(--flag);color:#000;border-radius:6px;padding:12px 14px;animation:drop .45s cubic-bezier(.2,.9,.3,1)}
.svc h3{margin:0 0 4px;font-size:16px;font-weight:700}
.svc ul{margin:0;padding:0;list-style:none}
.svc li{font-size:15px;line-height:1.35;padding:3px 0}
.svc li small{font-size:13px;font-weight:700;margin-right:7px;white-space:nowrap}
.svc button{margin-top:8px;font:inherit;font-weight:700;font-size:14px;background:#000;color:#fff;border:0;border-radius:999px;padding:6px 16px;cursor:pointer}
@keyframes drop{from{transform:translateY(-10px);opacity:0}}

/* countdown board */
.board{color:var(--sign-ink);border-radius:6px;overflow:hidden;background:linear-gradient(var(--sign) 0 5px,var(--sign-ink) 5px 7px,var(--sign) 7px)}
.board:empty{display:none}
.brow{display:grid;grid-template-columns:34px minmax(0,1fr) auto;align-items:center;column-gap:12px;padding:10px 14px;color:var(--sign-ink);text-decoration:none;border-top:1px solid #2b2b2b}
.brow:first-child{border-top:0;padding-top:18px}
.brow.end{display:block;padding:20px 14px 14px}
.bb{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:16px;letter-spacing:-.04em}
.bl{display:block;font-size:12px;font-weight:700;color:var(--sign-muted)}
.bn{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;font-weight:700;font-size:17px;line-height:1.2}
.bm{text-align:right;white-space:nowrap}
.bv{display:block;font-weight:700;font-size:19px;line-height:1.15;color:var(--flag);font-variant-numeric:tabular-nums}
.bs{display:block;font-size:12px;color:var(--sign-muted)}
.bv.tick{animation:flip .5s cubic-bezier(.65,0,.35,1)}
@keyframes flip{0%{transform:rotateX(0)}50%{transform:rotateX(88deg)}100%{transform:rotateX(0)}}

/* living sky */
.wx .tw{animation:tw 3.2s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.2}50%{opacity:1}}
.wx .cloud{animation:drift 26s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-16px)}to{transform:translateX(24px)}}
.wx .rs{animation:fall .8s linear infinite}
@keyframes fall{from{transform:translate(10px,-46px)}to{transform:translate(-24px,120px)}}
.wx.day .loc,.wx.day .sub,.wx.day .skyt,.wx.dawn .loc,.wx.dawn .sub,.wx.dawn .skyt,.wx.dusk .loc,.wx.dusk .sub,.wx.dusk .skyt,.wx.rain .loc,.wx.rain .sub,.wx.rain .skyt{color:rgba(255,255,255,.88)}
.wx .pp{color:#8f9bb8}
.wx.day .pp,.wx.day .wd,.wx.dawn .pp,.wx.dawn .wd,.wx.dusk .pp,.wx.dusk .wd,.wx.rain .pp,.wx.rain .wd{color:#c6cee0}

/* day pager and the sliding marker in the nav */
.pager{display:flex;align-items:flex-start;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;margin-inline:-18px;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
.pager::-webkit-scrollbar{display:none}
.pager.anim{transition:height .4s cubic-bezier(.65,0,.35,1)}
.pager > section{flex:0 0 100%;min-width:0;scroll-snap-align:start;scroll-snap-stop:always;padding-inline:18px}
nav.jump a.today{color:var(--flag)}
.slider{position:absolute;left:0;bottom:0;height:3px;width:0;background:#fff;transition:transform .4s cubic-bezier(.65,0,.35,1),width .4s cubic-bezier(.65,0,.35,1);pointer-events:none}

/* strip map */
.strip{position:relative;display:flex;margin:0 0 2px}
.strip::before{content:"";position:absolute;left:calc(50% / var(--n));right:calc(50% / var(--n));top:7px;height:4px;border-radius:2px;background:var(--ln);opacity:.3}
.strip::after{content:"";position:absolute;left:calc(50% / var(--n));top:7px;height:4px;border-radius:2px;background:var(--ln);width:calc((100% - 100% / var(--n)) * var(--sp,0));transition:width 1s cubic-bezier(.65,0,.35,1)}
.strip .stn{z-index:1}
.stn{position:relative;flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding-bottom:6px;text-decoration:none;color:var(--muted);font-size:11px;font-weight:500;font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent}
.stn .dw{height:18px;display:grid;place-items:center}
.stn .dot{width:14px;height:14px;border-width:3px}
.stn .dot.between{width:9px;height:9px;border-width:2.5px}
.stn.past > span:last-child{opacity:.6}
.stn.now{color:var(--ink);font-weight:700}
.stn.now .dot{animation:pulse 1.6s ease-out infinite}

/* rain switch */
.rainsw{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700}
.rainsw button{font-family:var(--font);font-weight:700;font-size:13px;line-height:18px;padding:3px 16px;border-radius:999px;border:1.5px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer}
.rainsw button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

/* live rail, done stamps, flash */
ol.stops li{scroll-margin-top:calc(var(--navh,35px) + 14px);border-radius:4px}
ol.stops li.past::before{background:var(--ln,var(--ink))}
ol.stops li.now::after{content:"";position:absolute;left:calc(4.5em + 10px + 9.5px);top:6px;width:3px;height:calc(100% * var(--p,0));background:var(--ln,var(--ink));transition:height 1s linear}
li.past .t,li.past .time{opacity:.5}
li.now .dot{animation:pulse 1.6s ease-out infinite}
li.now .t::after{content:"Now";font-weight:700;font-size:12px;color:#000;background:var(--flag);padding:1px 6px;border-radius:3px;margin-left:8px;vertical-align:2px;white-space:nowrap}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(252,204,10,.95)}100%{box-shadow:0 0 0 12px rgba(252,204,10,0)}}
.rail{cursor:pointer;-webkit-tap-highlight-color:transparent}
.rail:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.what{position:relative}
li.done .dot{background:var(--ink);border-color:var(--ink);position:relative;box-shadow:none}
li.done .dot::after{content:"";position:absolute;left:50%;top:50%;width:7px;height:4px;border-left:2px solid var(--bg);border-bottom:2px solid var(--bg);transform:translate(-50%,-70%) rotate(-45deg)}
li.done.between .dot::after{display:none}
li.done .t{text-decoration:line-through;text-decoration-thickness:1.5px;opacity:.5}
.stampd{position:absolute;right:0;top:-2px;font-weight:700;font-size:11px;letter-spacing:.08em;color:#ee352e;border:2px solid #ee352e;border-radius:3px;padding:1px 5px;transform:rotate(-8deg);background:var(--bg);pointer-events:none}
.stampd.in{animation:thunk .38s cubic-bezier(.2,1.5,.4,1)}
@keyframes thunk{from{transform:rotate(-8deg) scale(2.4);opacity:0}to{transform:rotate(-8deg) scale(1);opacity:1}}
ol.stops li.flash{animation:flash 1.8s ease-out}
@keyframes flash{0%,30%{background:rgba(252,204,10,.5)}100%{background:rgba(252,204,10,0)}}
.sunline{color:var(--ink)}

/* picks */
ul.eats .row{display:flex;align-items:stretch}
ul.eats .row button.eat{flex:1;min-width:0;width:auto}
button.star{flex:none;width:42px;background:none;border:0;padding:0;cursor:pointer;display:grid;place-items:center;-webkit-tap-highlight-color:transparent}
button.star svg{width:23px;height:23px;fill:none;stroke:var(--muted);stroke-width:1.6;stroke-linejoin:round}
button.star[aria-pressed="true"] svg{fill:var(--flag);stroke:var(--ink);animation:pop .4s cubic-bezier(.2,1.7,.4,1)}
@keyframes pop{from{transform:scale(.4)}to{transform:scale(1)}}
.sorter .pk{flex:none;padding:3px 10px;background:var(--flag);border-color:#000;color:#000}
.picks{border:2px solid var(--ink);border-radius:6px;padding:12px 14px;scroll-margin-top:calc(var(--navh,35px) + 56px)}
.picks h3{margin:0 0 6px;font-size:17px;font-weight:700}
.picks ul{margin:0 0 12px;padding:0;list-style:none;font-size:15px}
.picks li{padding:2px 0}
.picks button{font:inherit;font-weight:700;font-size:15px;background:var(--ink);color:var(--bg);border:0;border-radius:999px;padding:8px 16px;cursor:pointer}

  if (window.__NOW){ var f = String(window.__NOW).split("T"); return {date:f[0], mins:hm(f[1])}; }

      .formatToParts(new Date()).forEach(function(p){ o[p.type] = p.value; });
    return {date:o.year + "-" + o.month + "-" + o.day, mins:(+o.hour % 24) * 60 + (+o.minute) + (+o.second) / 60};
  } catch(e){

    return {date:d.getFullYear() + "-" + z(d.getMonth() + 1) + "-" + z(d.getDate()), mins:d.getHours() * 60 + d.getMinutes() + d.getSeconds() / 60};

/* ================= scrolling: cubic glide, and reveal() which also turns to the right day ================= */

  if (sec){

  if (node.matches && node.matches("ol.stops li")){

    setTimeout(function(){ node.classList.remove("flash"); }, 2000);

/* One day header sits above the pager and shows whichever day is on screen. It sticks under the nav, shrinks
   once it is stuck, and folds the agenda when tapped. Its strip map stays with it. */
function markStations(now){
  each(document.querySelectorAll(".stn"), function(s){
    var e = EVENTS[+s.getAttribute("data-ev")];
    s.classList.toggle("past", now >= e.a1); s.classList.toggle("now", now >= e.a0 && now < e.a1);
  });
  /* the strip's line fills in the day's color up to the present moment. Stations are evenly spaced, so the fill
     moves between two stations in proportion to the time between their start times. */
  each(document.querySelectorAll(".strip"), function(row){
    var ev = [], f = 0, k;
    each(row.querySelectorAll(".stn"), function(s){ ev.push(EVENTS[+s.getAttribute("data-ev")]); });
    if (ev.length > 1){
      var last = ev[ev.length - 1];
      if (now >= last.a0) f = 1;
      else for (k = 0; k < ev.length - 1; k++){
        if (now >= ev[k].a0 && now < ev[k + 1].a0){ f = (k + (now - ev[k].a0) / (ev[k + 1].a0 - ev[k].a0)) / (ev.length - 1); break; }
      }
    }
    row.style.setProperty("--sp", f.toFixed(4));
  });
}

  } else {
    if (cur) rows.push(boardRow("Now", cur, dur(cur.a1 - now), "left"));
    if (next) rows.push(boardRow(now < first.a0 ? "First up" : "Next", next, dur(next.a0 - now), (next.d === nyNow().date ? "at " : dayOf(next.d).short + " ") + clock(next.s)));
    key = (cur ? cur.i + ":" + dur(cur.a1 - now) : "") + "|" + (next ? next.i + ":" + dur(next.a0 - now) : "") + "|" + (cur ? evTitle(cur) : "") + (next ? evTitle(next) : "");
  }
  if (board && key !== boardKey){
    var had = boardKey !== "";
    boardKey = key; board.textContent = "";
    rows.forEach(function(r){ board.appendChild(r); });
    if (had && !calm) each(board.querySelectorAll(".bv"), function(v){ v.classList.add("tick"); });
  }
  /* now bar: the New York time and what is next, in the sticky bar above the tabs */
  var tm = Math.floor(nyNow().mins), nb = [null, "", "", "", "#d" + DAYS[DAYS.length - 1].num];
  nb[0] = clock((tm / 60 | 0) + ":" + (tm % 60 < 10 ? "0" : "") + (tm % 60));
  if (now >= last.a1 || !(next || cur)) nb[2] = "That's the trip. Safe flight home.";
  else if (next){ nb[1] = "Next up"; nb[2] = (evIco(next) ? evIco(next) + " " : "") + evTitle(next); nb[3] = "in " + dur(next.a0 - now); nb[4] = "#ev" + next.i; }
  else { nb[1] = "Now"; nb[2] = (evIco(cur) ? evIco(cur) + " " : "") + evTitle(cur); nb[3] = dur(cur.a1 - now) + " left"; nb[4] = "#ev" + cur.i; }
  ["nclk", "nlab", "ntit", "nin"].forEach(function(id, i){ var n = document.getElementById(id); if (n && n.textContent !== nb[i]) n.textContent = nb[i]; });
  var nbar = document.getElementById("nowbar"); if (nbar && nbar.getAttribute("href") !== nb[4]) nbar.setAttribute("href", nb[4]);
  /* sunset line */
  each(document.querySelectorAll("[data-sun]"), function(p){
    var d = dayOf(p.getAttribute("data-sun")), setAbs = absOf(d.date, d.set), left = setAbs - now, txt;
    if (left <= 0) txt = "The sun set at " + clock(d.set) + ".";
    else if (left <= 45) txt = "Golden hour now. Sunset in " + dur(left) + ".";
    else {
      var gm = hm(d.set) - 45, gold = fmt((gm / 60 | 0) + ":" + (gm % 60 < 10 ? "0" : "") + (gm % 60)).t;
      txt = "Sunset at " + clock(d.set) + (left < 14 * 60 ? ", in " + dur(left) : "") + ". Golden hour from about " + gold + ".";
    }
    if (p.textContent !== txt) p.textContent = txt;
  });
  skyTick();
  return {cur:cur, next:next, now:now};
}

/* ================= birthday confetti in line colors ================= */
function confettiFrom(node){
  if (calm) return;
  var r = node.getBoundingClientRect(), x0 = r.left + r.width / 2, y0 = r.top + r.height / 2;
  var dpr = Math.min(2, window.devicePixelRatio || 1), w = window.innerWidth, h = window.innerHeight;
  var cv = el("canvas", {"aria-hidden":"true", style:"position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:50"});
  cv.width = w * dpr; cv.height = h * dpr; document.body.appendChild(cv);
  var cx = cv.getContext("2d"), cols = ["#ee352e", "#00933c", "#b933ad", "#fccc0a", "#0039a6", "#ff6319", "#ffffff"], ps = [];
  for (var i = 0; i < 120; i++){
    var a = -Math.PI / 2 + (Math.random() - 0.5) * 2.4, v = 5 + Math.random() * 9;
    ps.push({x:x0, y:y0, vx:Math.cos(a) * v, vy:Math.sin(a) * v, s:5 + Math.random() * 5, c:cols[i % cols.length], rot:Math.random() * 6, vr:(Math.random() - 0.5) * 0.5, round:i % 3 === 0});
  }
  var t0 = performance.now();
  (function frame(t){
    var k = (t - t0) / 2400;
    cx.setTransform(dpr, 0, 0, dpr, 0, 0); cx.clearRect(0, 0, w, h);
    if (k >= 1){ if (cv.parentNode) cv.parentNode.removeChild(cv); return; }
    cx.globalAlpha = k < 0.7 ? 1 : 1 - (k - 0.7) / 0.3;
    ps.forEach(function(p){
      p.vy += 0.32; p.vx *= 0.985; p.x += p.vx; p.y += p.vy; p.rot += p.vr;
      cx.save(); cx.translate(p.x, p.y); cx.rotate(p.rot); cx.fillStyle = p.c;
      if (p.round){ cx.beginPath(); cx.arc(0, 0, p.s / 2, 0, 6.3); cx.fill(); } else cx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2);
      cx.restore();
    });
    requestAnimationFrame(frame);
  })(t0);
}
var partySeen = false;
function partyCheck(){
  var d = DAYS[active];
  if (!d || !d.party || d.date !== TODAY || !partySeen || store.get("party", "") === d.date) return;
  store.set("party", d.date);
  confettiFrom(dayHead.querySelector(".bullet"));
}

/* ================= start ================= */
(function(){
  var i0 = Math.max(0, DAYS.indexOf(dayOf(TODAY) || DAYS[0]));
  active = i0;
  pager.scrollLeft = sections[i0].offsetLeft - sections[0].offsetLeft;
  setActive(i0, false);
  headReady = true;
  if (folds.days) foldDays(true);
  requestAnimationFrame(function(){ pager.scrollLeft = sections[i0].offsetLeft - sections[0].offsetLeft; syncHeight(false); moveSlider(); });
  var st = live();
  setInterval(live, 20000);
  /* re-measure the headers once the web font has arrived */
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function(){ setNavH(); setHeads(); sizeDayFix(); syncHeight(false); moveSlider(); });
  document.addEventListener("visibilitychange", function(){ if (!document.hidden) live(); });
  if (window.IntersectionObserver){
    /* times roll and confetti fires when the agenda first comes into view; the route draws when the map does */
    var io = new IntersectionObserver(function(es){
      es.forEach(function(en){
        if (!en.isIntersecting) return;
        if (en.target === pager) flap(sections[active]);
        else if (!mapSeen){ mapSeen = true; drawMap(mapDate); }
        io.unobserve(en.target);
      });
    }, {threshold:0.15});
    io.observe(pager); io.observe(document.getElementById("mapbox"));
    /* confetti waits until the birthday header itself is on screen */
    var pio = new IntersectionObserver(function(es){
      es.forEach(function(en){
        partySeen = en.isIntersecting; clearTimeout(pio._t);
        if (partySeen) pio._t = setTimeout(function(){ if (partySeen) partyCheck(); }, 600);   /* not while gliding past */
      });
    }, {threshold:0.9});
    pio.observe(dayHead);
  } else { partySeen = true; }
  /* while a trip day is under way, open on the stop that is happening now */
  var tgt = st.cur || (st.next && st.next.d === TODAY && EVENTS.some(function(e){ return e.d === TODAY && e.a0 <= st.now; }) ? st.next : null);
  if (tgt) setTimeout(function(){ if (window.pageYOffset < 30){ var li = document.getElementById("ev" + tgt.i); if (li) reveal(li); } }, 900);
})();
