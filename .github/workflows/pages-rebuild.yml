# The site is served from the gh-pages branch, but updates are pushed to main.
# After every push to main this copies main onto gh-pages and asks Pages to rebuild.
name: Publish site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Copy main onto gh-pages
        run: git push --force origin HEAD:gh-pages
      - name: Request a Pages build
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
        env:
          GH_TOKEN: ${{ github.token }}
